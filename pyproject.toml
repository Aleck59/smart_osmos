[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "BLE",  # blind except — ловим осознанно и помечаем noqa
  "D",    # pydocstyle — Home Assistant требует докстроки
]
ignore = [
  "D203",  # конфликтует с D211
  "D213",  # конфликтует с D212
  "RUF001", # кириллица в строках — это язык интерфейса, не опечатка
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
