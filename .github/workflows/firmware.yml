name: Прошивка ESPHome

on:
  push:
    branches: ["**"]
    paths:
      - "esphome/**"
      - "tests/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "esphome/**"
      - "tests/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal:
    name: Тест журнала состояния
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Кольцевой журнал с распределением износа проверяется на ПК:
      # эмуляция NOR-flash, тысячи записей и обрывы питания посреди записи.
      - name: Собрать и запустить
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -I esphome/components \
              -o journal_test tests/test_flash_ring.cpp \
              esphome/components/smart_osmos/flash_ring.cpp
          ./journal_test

  validate:
    name: Проверка конфигурации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Установить ESPHome
        run: pip install --upgrade esphome

      - name: Проверить конфигурацию
        run: esphome config esphome/osmos-h2.yaml

  build:
    name: Сборка прошивки
    needs: [validate, journal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Тулчейн ESP-IDF весит сотни мегабайт — без кэша каждая сборка
      # тратит на его скачивание больше времени, чем на саму компиляцию.
      - name: Кэш PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            esphome/.esphome
          key: pio-${{ runner.os }}-${{ hashFiles('esphome/osmos-h2.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Установить ESPHome
        run: pip install --upgrade esphome

      - name: Собрать прошивку
        run: esphome compile esphome/osmos-h2.yaml

      - name: Собрать артефакты
        id: collect
        run: |
          set -euo pipefail
          out=dist
          mkdir -p "$out"
          build_dir=$(find esphome/.esphome/build -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "Каталог сборки: $build_dir"
          find "$build_dir" -name 'firmware*.bin' -exec cp -v {} "$out/" \;
          cp esphome/osmos-h2.yaml "$out/"
          ls -la "$out"

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: smart-osmos-firmware
          path: dist/
          if-no-files-found: error
