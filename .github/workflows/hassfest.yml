name: Проверка интеграции

on:
  push:
    branches: ["**"]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - ".github/workflows/hassfest.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - ".github/workflows/hassfest.yml"
  schedule:
    # Раз в неделю: hassfest и HACS меняют требования независимо от нас.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  lint:
    name: Проверка стиля Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check custom_components

      - name: ruff format --check
        run: ruff format --check custom_components
