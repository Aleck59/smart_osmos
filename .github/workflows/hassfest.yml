name: Проверка интеграции

on:
  push:
    branches: ["**"]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - ".github/workflows/hassfest.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - ".github/workflows/hassfest.yml"
  schedule:
    # Раз в неделю: hassfest и HACS меняют требования независимо от нас.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # brands      — иконка подаётся в home-assistant/brands отдельно,
          #               см. brands/README.md;
          # topics,
          # description — требования к метаданным репозитория на GitHub. Они
          #               нужны только для подачи в каталог HACS; установка
          #               через «Custom repositories» работает и без них.
          #               Заполните About у репозитория и уберите их отсюда.
          ignore: brands topics description

  lint:
    name: Проверка стиля Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Установить ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check custom_components tools

      - name: ruff format --check
        run: ruff format --check custom_components tools
