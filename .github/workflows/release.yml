name: Релиз

# Релиз собирается и публикуется по тегу вида v1.2.3:
#   git tag v1.2.3 && git push origin v1.2.3
# Номер версии берётся из тега и вшивается и в прошивку, и в интеграцию,
# поэтому менять его в файлах перед релизом не нужно.
#
# Если сборка по тегу упала, релиз можно перевыпустить для того же тега вручную:
# Actions → «Релиз» → Run workflow → указать тег.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег, например v1.1.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  firmware:
    name: Прошивка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Кэш PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            esphome/.esphome
          key: pio-${{ runner.os }}-${{ hashFiles('esphome/osmos-h2.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Установить ESPHome
        run: pip install --upgrade esphome

      - name: Собрать прошивку
        run: |
          version="${TAG#v}"
          esphome -s fw_version "$version" compile esphome/osmos-h2.yaml

      # Постоянные имена файлов: ссылка …/releases/latest/download/<файл>
      # всегда ведёт на свежую версию.
      # Куда ESPHome кладёт готовые файлы, зависит от версии: раньше это был
      # .pioenvs/<имя>/, теперь build/. Поэтому ищем по имени и берём свежий.
      - name: Подготовить файлы
        run: |
          set -euo pipefail
          newest() {
            find esphome/.esphome/build -name "$1" -type f -printf '%T@ %p\n' \
              | sort -nr | head -1 | cut -d' ' -f2-
          }
          ota=$(newest firmware.ota.bin)
          factory=$(newest firmware.factory.bin)
          if [ -z "$ota" ] || [ -z "$factory" ]; then
            echo "::error::Сборка не оставила firmware.ota.bin / firmware.factory.bin"
            find esphome/.esphome/build -name 'firmware*.bin'
            exit 1
          fi
          mkdir -p dist
          cp -v "$ota"     dist/smart-osmos-h2.ota.bin
          cp -v "$factory" dist/smart-osmos-h2.factory.bin

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  integration:
    name: Интеграция Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # HACS ставит интеграцию из этого архива (zip_release в hacs.json):
      # внутри — содержимое папки интеграции, версия в manifest.json = версия тега.
      - name: Собрать архив
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cd custom_components/smart_osmos
          python3 - "$version" << 'PY'
          import json, sys
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = sys.argv[1]
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          mkdir -p ../../dist
          zip -r ../../dist/smart_osmos.zip . -x "__pycache__/*"
          unzip -l ../../dist/smart_osmos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: integration
          path: dist/
          if-no-files-found: error

  release:
    name: Публикация
    runs-on: ubuntu-latest
    needs: [firmware, integration]
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist/
          merge-multiple: true

      - name: Создать релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/smart-osmos-h2.ota.bin
            dist/smart-osmos-h2.factory.bin
            dist/smart_osmos.zip
